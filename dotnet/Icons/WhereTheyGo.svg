<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Desire lines: journeys bundled between two ends, drawn at three widths because
       width is how many journeys. Deliberately NOT a map pin — the mod marks no spot
       and recommends no location. Monochrome, like the game's own infomode icons. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path stroke-width="7"   d="M13 47 Q20.1 16.9 51 19" />
    <path stroke-width="4"   d="M13 47 Q32 33 51 19" />
    <path stroke-width="2.2" d="M13 47 Q43.9 49.1 51 19" />
  </g>
  <circle fill="#FFFFFF" cx="13" cy="47" r="7" />
  <circle fill="#FFFFFF" cx="51" cy="19" r="7" />
</svg>
