<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Where they go: one origin, and the journeys leaving it for several
       places, at the widths the map uses because width is how many journeys.
       Not a map pin. The mod marks no spot and recommends no location. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <path stroke-width="6" d="M13 45 Q26 14 50 12" />
    <path stroke-width="4" d="M13 45 Q32 29 55 34" />
    <path stroke-width="2.6" d="M13 45 Q27 55 41 55" />
  </g>
  <circle fill="#FFFFFF" cx="50" cy="12" r="4.6" />
  <circle fill="#FFFFFF" cx="55" cy="34" r="4.2" />
  <circle fill="#FFFFFF" cx="41" cy="55" r="3.8" />
  <circle fill="#FFFFFF" cx="13" cy="45" r="7.5" />
</svg>
